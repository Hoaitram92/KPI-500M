<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MISSION 500M</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ================= BACKGROUND ================= -->

    <div class="sky">

        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>

    </div>

    <div class="ground"></div>

    <canvas id="fireworks"></canvas>

    <!-- ================= MAIN ================= -->

    <div class="container">

        <header>

            <h1>🚀 MISSION 500M</h1>

            <p>
                KPI Campaign Dashboard
            </p>

        </header>

        <!-- KPI -->

        <section class="kpi-grid">

            <div class="card">

                <div class="title">
                    Doanh số
                </div>

                <div id="money" class="value">
                    0 ₫
                </div>

            </div>

            <div class="card">

                <div class="title">
                    Hoàn thành
                </div>

                <div id="percent" class="value">
                    0%
                </div>

            </div>

            <div class="card">

                <div class="title">
                    Mục tiêu
                </div>

                <div class="value">
                    500.000.000 ₫
                </div>

            </div>

        </section>

        <!-- RACE -->

        <section class="race">

            <div class="track">

                <div id="bar"></div>

                <div id="dino">
                    🦖
                </div>

                <div id="flag">
                    🏁
                </div>

            </div>

        </section>

        <!-- POPUP -->

        <div id="popup">

            <div class="popup-title">
                🎉 Đơn hàng mới
            </div>

            <div id="popupStore"></div>

            <div id="popupMoney"></div>

        </div>

        <!-- LEADERBOARD -->

        <section class="leaderboard">

            <h2>
                🏆 TOP 10 ĐẠI LÝ
            </h2>

            <table>

                <thead>

                    <tr>

                        <th>Hạng</th>

                        <th>Đại lý</th>

                        <th>Doanh số</th>

                    </tr>

                </thead>

                <tbody id="leaderboard">

                    <tr>

                        <td colspan="3">

                            Đang tải dữ liệu...

                        </td>

                    </tr>

                </tbody>

            </table>

        </section>

    </div>

    <script src="script.js"></script>

</body>

</html>
