<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MISSION 500M</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ================= BACKGROUND ================= -->

<div class="sky">

    <div class="cloud cloud1">☁️</div>
    <div class="cloud cloud2">☁️</div>
    <div class="cloud cloud3">☁️</div>

</div>

<div class="ground"></div>

<!-- ================= DASHBOARD ================= -->

<div class="container">

    <header>

        <h1>
            🚀 MISSION 500M
        </h1>

        <p>
            Dashboard doanh số thời gian thực
        </p>

    </header>

    <!-- KPI -->

    <section class="kpi">

        <div class="card">

            <span class="label">
                Doanh số
            </span>

            <div id="money" class="value">
                0 ₫
            </div>

        </div>

        <div class="card">

            <span class="label">
                Hoàn thành
            </span>

            <div id="percent" class="value">
                0%
            </div>

        </div>

        <div class="card">

            <span class="label">
                Mục tiêu
            </span>

            <div class="value">

                500.000.000 ₫

            </div>

        </div>

    </section>

    <!-- Race -->

    <section class="race">

        <div class="finish">

            🏁

        </div>

        <div id="dino">

            🦖

        </div>

    </section>

    <!-- Progress -->

    <section class="progress">

        <div id="bar"></div>

    </section>

    <!-- Latest Order -->

    <section id="popup">

        <div class="popup-title">

            🏪 ĐƠN HÀNG MỚI

        </div>

        <div id="popupStore">

            --

        </div>

        <div id="popupMoney">

            --

        </div>

    </section>

    <!-- Leaderboard -->

    <section class="leaderboard">

        <h2>

            🏆 TOP ĐẠI LÝ

        </h2>

        <table>

            <thead>

                <tr>

                    <th>#</th>

                    <th>Đại lý</th>

                    <th>Doanh số</th>

                </tr>

            </thead>

            <tbody id="leaderboard">

                <tr>

                    <td colspan="3">

                        Đang tải...

                    </td>

                </tr>

            </tbody>

        </table>

    </section>

</div>

<!-- Firework -->

<canvas id="fireworks"></canvas>

<script src="script.js"></script>

</body>

</html>
