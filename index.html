<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MISSION 500M</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="background"></div>

<div class="container">

    <h1>🚀 MISSION 500M</h1>

    <div class="goal">
        Mục tiêu: <b>500.000.000 ₫</b>
    </div>

    <!-- Đường chạy -->
    <div class="race">

        <div class="flag">
            🏁
        </div>

        <div id="dino" class="dino">
            🦖
        </div>

    </div>

    <!-- Tiến độ -->
    <div class="progress">

        <div id="bar" class="bar"></div>

    </div>

    <!-- Doanh số -->
    <div id="money" class="money">
        0 ₫
    </div>

    <div id="percent" class="percent">
        0%
    </div>

    <!-- Popup -->
    <div id="popup" class="popup">

        <div class="popup-title">
            🏪 ĐẠI LÝ VỪA LÊN ĐƠN
        </div>

        <div id="popupStore"></div>

        <div id="popupMoney"></div>

    </div>

</div>

<canvas id="fireworks"></canvas>

<script src="script.js"></script>

</body>

</html>
